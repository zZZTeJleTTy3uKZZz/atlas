[project]
# dist-имя atlas-pm (имя `atlas` занято, `atlas-cli` — too-similar по typosquatting-гейту
# PyPI); import-пакет и команда остаются `atlas`. Ставится: uv tool install atlas-pm /
# pipx install atlas-pm.
name = "atlas-pm"
version = "0.4.4"
description = "Atlas — local-first PM-система для портфеля проектов и задач"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atlas CLI contributors" }]
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    # PM-слой (Spike v0.4+)
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "python-frontmatter>=1.1",
    "python-slugify>=8.0.4",
    # S-kits (PyPI; dist-name s-*, импорт-пакеты clikit/librarykit/adapterkit)
    # >=0.2.0 — `clikit.config` без pydantic/pydantic-settings (кит-волна 5,
    # #2710): `AtlasConfig(AppConfig)` — обычное наследование класса без
    # `@dataclass`, поведение не меняется (только str/bool поля, без nested).
    "s-clikit>=0.2.0,<0.3",
    "s-librarykit>=0.1.3,<0.9",
    "s-adapterkit>=0.2.0,<0.3",
    # Кит доставки событий (волна 7, #2718): монотонный курсор, продвижение
    # курсора после применения, разделение временного и постоянного отказа.
    # Верхняя граница по правилу 0.x — минор кита может ломать контракт.
    "s-replicationkit>=0.1,<0.2",
    # agentskit (онбординг AI-агентов) и issuekit (шаблоны/валидатор жалоб)
    # больше НЕ тянутся с PyPI: у обоих был ровно один потребитель — Atlas —
    # и по спеке платформы (Atlas #2710, волна 5) код физически перенесён в
    # atlas._vendor.{agentskit,issuekit}. Оригинальные киты остаются на диске
    # в замороженном виде (см. их README) на случай второго потребителя.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.32",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

#: Инструменты прогона продублированы ГРУППОЙ (skl#2545): группу uv
#: синхронизирует сама, а extra требует явного `--extra dev` — забыли флаг,
#: и `uv run pytest` молча берёт СИСТЕМНЫЙ pytest с системными версиями
#: зависимостей, то есть проверяет не то окружение, которое собирается.
#: Extra `dev` НЕ удалён намеренно — на него ссылаются снаружи (.gitlab-ci.yml),
#: ломать внешнего потребителя нельзя. Состав держим одинаковым.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.32",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
atlas = "atlas.cli:main"

[project.urls]
# Well-known метки (PEP 753): PyPI рисует у них иконки и отдельную строку в
# сайдбаре. Без Changelog пользователь пакета не мог узнать, что изменилось.
Homepage = "https://github.com/zZZTeJleTTy3uKZZz/atlas"
Repository = "https://github.com/zZZTeJleTTy3uKZZz/atlas"
Changelog = "https://github.com/zZZTeJleTTy3uKZZz/atlas/blob/master/CHANGELOG.md"
"Release Notes" = "https://github.com/zZZTeJleTTy3uKZZz/atlas/releases"
Issues = "https://github.com/zZZTeJleTTy3uKZZz/atlas/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

# Миграции нужны в РАНТАЙМЕ (`atlas project init` → alembic upgrade), поэтому
# кладём их и alembic.ini ВНУТРЬ пакета (`atlas/migrations`, `atlas/alembic.ini`) —
# иначе pip/uvx/pipx-установка их не несёт и init падает (#880). В dev/editable
# `run_migrations` находит их в корне репо.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "atlas/migrations"
"alembic.ini" = "atlas/alembic.ini"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Компактные setup-строки в тестах («a = 1; b = 2») — осознанный стиль набора:
# переписывать 87 мест ради косметики дороже пользы, а гейт `ruff check .` должен
# оставаться сигналом о настоящих проблемах.
"tests/*" = ["E702"]
# Alembic-паттерн: импорты идут после настройки sys.path и конфигурации env.
"migrations/env.py" = ["E402"]
